<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#73b9f1">
	<meta name="description" content="Your hotels, flights, trains, and travel plans, together in one place.">
	<title>Booking | Skyline</title>
	<link rel="icon" href="image/avatar.png" type="image/png">
	<link rel="preload" href="image/booking-sky.jpg" as="image">
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="booking.css">
	<script src="app.js" defer></script>
	<script src="booking.js" defer></script>
</head>
<body class="booking-page" data-page="booking">
	<svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true">
		<symbol id="house" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
		<symbol id="bell" viewBox="0 0 24 24"><path d="M10.268 21a2 2 0 0 0 3.464 0M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></symbol>
		<symbol id="bot" viewBox="0 0 24 24"><path d="M12 8V4H8M2 14h2M20 14h2M15 13v2M9 13v2"/><rect width="16" height="12" x="4" y="8" rx="2"/></symbol>
		<symbol id="bed-double" viewBox="0 0 24 24"><path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4M12 4v6M2 18h20"/></symbol>
		<symbol id="clipboard-check" viewBox="0 0 24 24"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2m1 10 2 2 4-4"/></symbol>
		<symbol id="train-front" viewBox="0 0 24 24"><path d="M8 3.1V7a4 4 0 0 0 8 0V3.1M9 15l-1-1m7 1 1-1M9 19c-2.8 0-5-2.2-5-5v-4a8 8 0 0 1 16 0v4c0 2.8-2.2 5-5 5Zm-1 0-2 3m10-3 2 3"/></symbol>
		<symbol id="bus-front" viewBox="0 0 24 24"><path d="M4 6 2 7m8-1h4m8 1-2-1M4 11h16M8 15h.01M16 15h.01M6 19v2m12 0v-2"/><rect width="16" height="16" x="4" y="3" rx="2"/></symbol>
		<symbol id="car-front" viewBox="0 0 24 24"><path d="m21 8-2 2-1.5-3.7A2 2 0 0 0 15.646 5H8.4a2 2 0 0 0-1.903 1.257L5 10 3 8m4 6h.01M17 14h.01M5 18v2m14-2v2"/><rect width="18" height="8" x="3" y="10" rx="2"/></symbol>
		<symbol id="wallet" viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></symbol>
		<symbol id="shopping-cart" viewBox="0 0 24 24"><path d="m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25"/><circle cx="18" cy="20" r="2"/><circle cx="8" cy="20" r="2"/></symbol>
		<symbol id="grip" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="19" cy="5" r="1"/><circle cx="5" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="12" cy="19" r="1"/><circle cx="19" cy="19" r="1"/><circle cx="5" cy="19" r="1"/></symbol>
		<symbol id="calendar-days" viewBox="0 0 24 24"><path d="M8 2v3m8-3v3M3 9h18M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01M16 17h.01"/><rect x="3" y="3" width="18" height="18" rx="2"/></symbol>
		<symbol id="calendar" viewBox="0 0 24 24"><path d="M8 2v3m8-3v3M3 9h18"/><rect x="3" y="3" width="18" height="18" rx="2"/></symbol>
		<symbol id="ellipsis" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></symbol>
		<symbol id="download" viewBox="0 0 24 24"><path d="M12 15V3M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5"/></symbol>
		<symbol id="plane" viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></symbol>
		<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
		<symbol id="chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
		<symbol id="arrow-right" viewBox="0 0 24 24"><path d="M5 12h14m-7-7 7 7-7 7"/></symbol>
		<symbol id="x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
		<symbol id="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
		<symbol id="plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
		<symbol id="user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
		<symbol id="settings" viewBox="0 0 24 24"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></symbol>
		<symbol id="map-pin" viewBox="0 0 24 24"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></symbol>
	</svg>

	<a class="skip-link" href="#booking-main">Skip to bookings</a>
	<header class="booking-topbar">
		<a class="round-button booking-home" href="index.html" aria-label="Home dashboard" title="Home"><svg class="icon" aria-hidden="true"><use href="#house"/></svg></a>
		<div class="booking-header-actions">
			<div class="menu-wrap">
				<button class="round-button notification-button" data-popover="notifications" aria-label="Notifications" title="Notifications" aria-expanded="false" aria-controls="notifications"><svg class="icon" aria-hidden="true"><use href="#bell"/></svg><span class="notification-dot" aria-hidden="true"></span></button>
				<section id="notifications" class="popover notifications" aria-label="Notifications" hidden></section>
			</div>
			<div class="menu-wrap">
				<button class="avatar-button" data-popover="profile-menu" aria-label="Gopi's account" aria-expanded="false" aria-controls="profile-menu" title="Your account"><img class="avatar" src="image/avatar.png" width="58" height="58" alt="Gopi"><span class="online-indicator" aria-label="Online"></span></button>
				<section id="profile-menu" class="popover profile-menu" aria-label="Your account" hidden>
					<div class="account-preview"><strong data-profile-name>Gopi</strong><span>Bangalore, India</span></div>
					<button data-action="profile"><svg class="icon" aria-hidden="true"><use href="#user"/></svg> View profile</button>
					<button data-action="settings"><svg class="icon" aria-hidden="true"><use href="#settings"/></svg> Account settings</button>
				</section>
			</div>
		</div>
	</header>

	<div class="booking-layout">
		<aside class="booking-sidebar" aria-label="Plan navigation">
			<div class="plan-brand"><span class="plan-brand-icon"><svg class="icon" aria-hidden="true"><use href="#calendar-days"/></svg></span><div><h2>Plan</h2><p>Organize your life</p></div></div>
			<nav class="plan-nav" aria-label="Plan">
				<button data-plan-view="tasks"><svg class="icon" aria-hidden="true"><use href="#clipboard-check"/></svg><span>Tasks</span></button>
				<button class="is-current" aria-current="page" data-plan-view="booking"><svg class="icon" aria-hidden="true"><use href="#bed-double"/></svg><span>Booking</span></button>
				<button data-plan-view="events"><svg class="icon" aria-hidden="true"><use href="#calendar-days"/></svg><span>Events</span></button>
				<button data-plan-view="shopping"><svg class="icon" aria-hidden="true"><use href="#shopping-cart"/></svg><span>Shopping</span></button>
				<button data-plan-view="calendar"><svg class="icon" aria-hidden="true"><use href="#calendar"/></svg><span>Calendar</span></button>
				<button data-plan-view="scheduling"><svg class="icon" aria-hidden="true"><use href="#clock"/></svg><span>Scheduling</span></button>
			</nav>
		</aside>

		<main id="booking-main" class="booking-main" tabindex="-1">
			<header class="booking-heading"><span class="booking-heading-icon"><svg class="icon" aria-hidden="true"><use href="#bed-double"/></svg></span><div><h1>Booking</h1><p>Your Agent keeps your plans updated here.</p><span class="agent-managed">Agent managed</span></div></header>
			<div class="booking-categories" role="group" aria-label="Filter bookings by category">
				<button data-booking-action="filter" data-type="hotels" aria-pressed="false"><span class="category-icon hotel-category"><svg class="icon" aria-hidden="true"><use href="#bed-double"/></svg></span><span>Hotels</span></button>
				<button data-booking-action="filter" data-type="flights" aria-pressed="false"><span class="category-icon flight-category"><svg class="icon" aria-hidden="true"><use href="#plane"/></svg></span><span>Flights</span></button>
				<button data-booking-action="filter" data-type="trains" aria-pressed="false"><span class="category-icon train-category"><svg class="icon" aria-hidden="true"><use href="#train-front"/></svg></span><span>Trains</span></button>
				<button data-booking-action="filter" data-type="bus" aria-pressed="false"><span class="category-icon bus-category"><svg class="icon" aria-hidden="true"><use href="#bus-front"/></svg></span><span>Bus</span></button>
				<button data-booking-action="filter" data-type="cars" aria-pressed="false"><span class="category-icon car-category"><svg class="icon" aria-hidden="true"><use href="#car-front"/></svg></span><span>Rental Cars</span></button>
				<button data-booking-action="filter" data-type="others" aria-pressed="false"><span class="category-icon other-category"><svg class="icon" aria-hidden="true"><use href="#ellipsis"/></svg></span><span>Others</span></button>
			</div>

			<section class="booking-section upcoming-bookings" aria-labelledby="upcoming-heading">
				<div class="booking-section-header"><h2 id="upcoming-heading">Upcoming Bookings</h2><button class="booking-text-link" data-booking-action="view-all">View all <svg class="icon" aria-hidden="true"><use href="#arrow-right"/></svg></button></div>
				<div class="booking-list" id="booking-list" aria-live="polite">
					<button class="booking-item" data-booking-action="details" data-id="goa-trip"><img class="booking-photo" src="image/booking-hotel.jpg" width="136" height="70" alt="A sea-view room at a beach resort"><span class="booking-copy"><strong>Goa Trip</strong><span class="booking-provider">Hotel Sea View Resort</span><span class="booking-date"><svg class="icon" aria-hidden="true"><use href="#calendar"/></svg><span>Oct 15 &ndash; Oct 18, 2026</span></span></span><span class="booking-status confirmed">Confirmed</span><svg class="icon booking-chevron" aria-hidden="true"><use href="#chevron-right"/></svg></button>
					<button class="booking-item" data-booking-action="details" data-id="delhi-flight"><img class="booking-photo" src="image/booking-flight.jpg" width="136" height="70" alt="An IndiGo aircraft in a blue sky"><span class="booking-copy"><strong>Bangalore to Delhi</strong><span class="booking-provider">IndiGo 6E 214</span><span class="booking-date"><svg class="icon" aria-hidden="true"><use href="#calendar"/></svg><span>Oct 20, 2026 <span class="date-separator">&middot;</span> 10:30 AM</span></span></span><span class="booking-status confirmed-flight">Confirmed</span><svg class="icon booking-chevron" aria-hidden="true"><use href="#chevron-right"/></svg></button>
					<button class="booking-item" data-booking-action="details" data-id="jaipur-train"><img class="booking-photo" src="image/booking-train.jpg" width="136" height="70" alt="An express train at the station"><span class="booking-copy"><strong>Delhi to Jaipur</strong><span class="booking-provider">Rajasthan Express 12956</span><span class="booking-date"><svg class="icon" aria-hidden="true"><use href="#calendar"/></svg><span>Oct 25, 2026 <span class="date-separator">&middot;</span> 6:45 AM</span></span></span><span class="booking-status pending">Pending</span><svg class="icon booking-chevron" aria-hidden="true"><use href="#chevron-right"/></svg></button>
				</div>
			</section>

		</main>
	</div>

	<dialog id="detail-dialog" aria-labelledby="dialog-title"><div class="dialog-header"><div><p class="dialog-eyebrow" id="dialog-eyebrow">Your plans, together</p><h2 id="dialog-title"></h2></div><button class="round-button dialog-close" data-action="close" aria-label="Close dialog" title="Close"><svg class="icon" aria-hidden="true"><use href="#x"/></svg></button></div><div id="dialog-content"></div></dialog>
	<div class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
